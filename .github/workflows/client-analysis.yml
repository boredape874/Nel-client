name: Minecraft Windows client analysis
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'detect: manifest / triage: hashes and signatures / deep: Ghidra function diff'
        type: choice
        options: [detect, triage, deep]
        default: triage
  schedule:
    - cron: '43 4 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: client-analysis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || vars.MCBE_AUTO_MODE != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      MODE: ${{ inputs.mode || vars.MCBE_AUTO_MODE || 'detect' }}
      MCBE_ALLOWED_HOSTS: ${{ vars.MCBE_ALLOWED_HOSTS }}
      REPORT_AGE_RECIPIENT: ${{ vars.REPORT_AGE_RECIPIENT }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Initialize ephemeral work path
        run: echo "WORK=$RUNNER_TEMP/nel-client-analysis" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install optional report encryption
        if: env.MODE == 'deep' && env.REPORT_AGE_RECIPIENT != ''
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - name: Compare owner-provided client inputs
        id: analysis
        env:
          GH_READ_TOKEN: ${{ github.token }}
          MCBE_INPUTS_JSON: ${{ secrets.MCBE_INPUTS_JSON }}
          MCBE_MANIFEST_URL: ${{ secrets.MCBE_MANIFEST_URL }}
        run: python3 tools/bedrock_analysis.py client --mode "$MODE" --work "$WORK"
      - name: Upload summaries and optional encrypted details
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.analysis.outputs.artifact_name || format('client-incomplete-{0}', github.run_id) }}
          path: ${{ runner.temp }}/nel-client-analysis/publish/
          retention-days: 30
          if-no-files-found: ignore
      - name: Remove ephemeral client files and databases
        if: always()
        run: rm -rf -- "$WORK"
