name: Client automation CI

on:
  push:
    paths:
      - "scripts/mcbe_compat.py"
      - "tests/**"
      - "compat/**"
      - ".github/workflows/client-automation-ci.yml"
  pull_request:
    paths:
      - "scripts/mcbe_compat.py"
      - "tests/**"
      - "compat/**"
      - ".github/workflows/client-automation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline fixture tests
        run: python -m unittest discover -s tests -v
